{% extends 'base.html' %}

{% block title %} MovieHub | Add Movie {% endblock %}

{% block content %}

    <section>
        <div>
            {% for movie in all_movies %}
                <div>
                    <img src="{{movie.poster.url}}">
                    <div>
                        {{movie.name}}
                    </div>
                    <a href="{% url 'movies:movie_detail' movie.id %}">View Details</a>
                </div>
            {% endfor %}
        </div>
    </section>
{% endblock %}
