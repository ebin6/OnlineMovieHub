{% extends 'base.html' %}

{% block title %} MovieHub | Login {% endblock %}

{% block content %}
    <h1>Login</h1>
    {% for msg in messages %}
        <p>{{msg}}</p>
    {% endfor %}
    <main>
        <form method="post" action="">
            {% csrf_token %}
            <div>
                <label>Username</label>
                <input type="text" name="username">
            </div>

            <div>
                <label>Password</label>
                <input type="password" name="passwd">
            </div>

            <div>
                <input type="submit" value="SignIn">
            </div>
        </form>
    </main>
{% endblock %}
