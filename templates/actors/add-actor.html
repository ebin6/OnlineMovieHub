<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online MovieHub | Add Actor</title>
</head>
<body>
    <section>
        {% for msg in messages %}
            {{msg}}
        {% endfor %}
        <h1>Add Actor</h1>
        <div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{form.as_div}}
                <input type="submit" value="Add Actor">
            </form>
        </div>
    </section>
</body>
</html>
