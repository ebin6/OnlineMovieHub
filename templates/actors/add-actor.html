{% extends 'base.html' %}

{% block title %} MovieHub | Add Actor {% endblock %}

{% block content %}
    <section>
        {% for msg in messages %}
            {{msg}}
        {% endfor %}
        <h1>Add Actor</h1>
        <div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{form.as_div}}
                <input type="submit" value="Add Actor">
            </form>
        </div>
    </section>


{% endblock %}
