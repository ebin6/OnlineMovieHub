{% extends 'base.html' %}

{% block title %} MovieHub | Register {% endblock %}

{% block content %}
    <main>
        <h1>Register</h1>

        {% for msg in messages %}
            <p>{{msg}}</p>
        {% endfor %}
        <form method="post" onsubmit="return checkPasswords()" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label>First Name</label>
                <input type="text" name="f_name">
            </div>
            <div>
                <label>Last Name</label>
                <input type="text" name="l_name">
            </div>
            <div>
                <label>E-mail</label>
                <input type="email" name="email">
            </div>
            <div>
                <label>Profile Picture</label>
                <input type="file" name="profile_pic">
            </div>
            <div>
                <label>Phone</label>
                <input type="text" name="phone">
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" id="password">
            </div>
            <div>
                <label>Confirm Password</label>
                <input type="password" name="con_password" id="con_password">
            </div>
            <div>
                <input type="submit" value="SignUp">
            </div>
        </form>
    </main>

    <script>
        function checkPasswords(){
            let passwd=document.getElementById("password").value;
            let confirm_password=document.getElementById("con_password").value;
            if(passwd==confirm_password){
                return true
            }
            else{
                alert("Passwords must be same")
                return false
            }
        }
    </script>
{% endblock %}
