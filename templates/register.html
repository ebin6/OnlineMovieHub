<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Register</title>
</head>
<body>
    <main>
        <form method="post" onsubmit="return checkPasswords()">
            {% csrf_token %}
            <div>
                <label>First Name</label>
                <input type="text" name="f_name">
            </div>
            <div>
                <label>Last Name</label>
                <input type="text" name="l_name">
            </div>
            <div>
                <label>E-mail</label>
                <input type="email" name="email">
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" id="password">
            </div>
            <div>
                <label>Confirm Password</label>
                <input type="password" name="con_password" id="con_password">
            </div>
            <div>
                <input type="submit" value="SignUp">
            </div>
        </form>
    </main>

    <script>
        function checkPasswords(){
            let passwd=document.getElementById("password").value;
            let confirm_password=document.getElementById("con_password").value;
            if(passwd==confirm_password){
                return true
            }
            else{
                alert("Passwords must be same")
                return false
            }
        }
    </script>
</body>
</html>
