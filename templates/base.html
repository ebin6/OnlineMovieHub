<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="{% url 'movies:index' %}">Home</a></li>
                <li><a href="{% url 'movies:all_movies' %}">All Movies</a></li>
                <li><a href="{% url 'actors:list_actors' %}">All Actors</a></li>
                {% if request.user.is_authenticated %}
                    <li><a href="{% url 'accounts:logout' %}">Logout</a></li>
                {% else %}
                    <li><a href="{% url 'accounts:register' %}">Register</a></li>
                    <li><a href="{% url 'accounts:login' %}">Login</a></li>
                {% endif %}
                <li>
                    <div>
                        <form method="GET">
                            <select name="category" onchange="this.form.submit()">
                                <option value="">All Categories</option>
                                {% for cat in categories %}
                                    <option value="{{cat.slug}}" {% if request.GET.category == cat.id|stringformat:"s" %}selected{% endif %}>{{cat.category}}</option>
                                {% endfor %}
                            </select>
                        </form>
                    </div>
                </li>
            </ul>
        </nav>

    </header>
    {% block content %}

    {% endblock %}
    <footer>
        <p>MovieHub - Copyright ©</p>
    </footer>
</body>
</html>
