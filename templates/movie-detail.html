<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Details</title>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                    <li><a href="{% url 'movies:index' %}">Home</a></li>
                    <li><a href="{% url 'movies:all_movies' %}">All Movies</a></li>
                    {% if request.user.is_authenticated %}
                        <li><a href="{% url 'accounts:logout' %}">Logout</a></li>
                    {% else %}
                        <li><a href="{% url 'accounts:register' %}">Register</a></li>
                        <li><a href="{% url 'accounts:login' %}">Login</a></li>
                    {% endif %}
            </ul>
        </nav>
    </header>
    <section>
        <div style="display: flex;">
            <div>
                <img src="{{movie.poster.url}}">
            </div>
            <div style="padding: 30px 70px;">
                <h1>{{movie.name}}</h1>
                <p>{{movie.description}}</p>
                <p>{{movie.category}}</p>
                <p>{{movie.release_date}}</p>
                <div>
                    <a href="{% url 'movies:edit_movie' movie.id %}">Update</a>
                </div>
                <div>
                    <a href="{% url 'movies:delete_movie' movie.id %}" onclick="return deleteConfirmation()">Delete</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        function deleteConfirmation(){
            let choice=confirm("Do you wish to delete this movie ?")
            return choice
        }
    </script>
</body>
</html>
